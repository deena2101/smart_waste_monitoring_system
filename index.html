<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Waste Segregator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f4f4f4;
        }

        #stream {
            border: 5px solid #333;
            border-radius: 10px;
            width: 500px;
        }

        .result-box {
            margin-top: 20px;
            padding: 20px;
            background: white;
            display: inline-block;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
        }

        button:hover {
            background: #218838;
        }
    </style>
</head>

<body>
    <h1>EcoSmart Waste Classifier</h1>
    <!-- ESP32-CAM live MJPEG stream -->
    <img id="stream" src="http://192.168.96.1:81/stream" alt="ESP32-CAM Stream">
    <br><br>
    <button onclick="capture()">Identify Waste</button>
    <br>
    <div class="result-box">
        <h2 id="prediction">Prediction: ---</h2>
        <p id="confidence">Confidence: ---</p>
    </div>

    <script>
        const predText = document.getElementById('prediction');
        const confText = document.getElementById('confidence');

        function capture() {
            predText.innerText = "Analyzing...";

            // Tell backend to fetch from ESP32-CAM and predict
            fetch('http://localhost:5001/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({})
            })
                .then(res => res.json())
                .then(data => {
                    if (data.error) {
                        predText.innerText = "Error: " + data.error;
                        return;
                    }
                    predText.innerText = "Prediction: " + data.label.toUpperCase();
                    confText.innerText = "Confidence: " + (data.confidence * 100).toFixed(2) + "%";
                })
                .catch(err => {
                    predText.innerText = "Error: Is the Python script running?";
                    console.error(err);
                });
        }
    </script>
</body>

</html>
